[package]
name = "warren"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "OpenVPN profile manager: many tunnels at once, encrypted saved passwords, TUI and waybar module"
license = "MIT"
repository = "https://github.com/lazicnemanja/warren"
readme = "README.md"
keywords = ["openvpn", "vpn", "tui", "waybar", "otp"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "warren"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
libc = "0.2"
ratatui = "0.29"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }

# Argon2 with 64 MiB is painfully slow unoptimized; keep crypto fast in debug builds too.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
